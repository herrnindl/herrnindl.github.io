<style>
.stage { position: relative; width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--fg); margin-top: 8px; }
.stage img { position: absolute; max-width: none; opacity: 0; transition: opacity .35s ease; user-select: none; -webkit-user-drag: none; }
.stage img.on { opacity: 1; }
.lab { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 6px; }
.lab b { font-weight: 800; font-size: 30px; letter-spacing: -.045em; }
input[type=range] { -webkit-appearance: none; appearance: none; padding: 0; height: 8px; border: 0; border-radius: 4px; outline: none; margin: 16px 0 6px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--fg); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--fg); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--fg); border: 3px solid var(--bg); }
.ends { display: flex; justify-content: space-between; }

<body>
<div class="wrap">
  <header><a class="mark" href="./">MN.</a></header>
  <nav class="more" aria-label="more"></nav>

  <h1>glow up.</h1>
  <p class="sub">from origin. to now. drag.</p>
  <div class="stage" id="stage"></div>
  <input type="range" id="t" min="0" max="0" value="0" aria-label="time">
  <div class="ends small"><span>ORIGIN.</span><span>NOW.</span></div>
  <div class="lab"><b id="lab"></b><span class="small" id="when"></span></div>
  <div class="row"><button class="btn" id="play">play</button></div>
  <footer class="foot"></footer>
</div>
<script src="extra.js"></script>
<script>
/* oldest chapter first; per chapter only the best photos (picked ones first), the face is kept at the same size */
const ORDER = ["origin", "white", "baby-blue", "lavendel", "navy-blue", "grey", "vanilla", "vanilla-2", "ber", "ember", "red"];
const PER = 3;   /* at most this many per chapter, one per shoot */
let pics = [], imgs = [], i = 0, timer = null;
const ymd = s => s ? s.split(".").reverse().join("") : "99999999";   /* no date yet = newest (the Marla Pilz shoot came after Ronald Mitterer) */
loadPhotos().then(async list => {
  list = list.filter(p => p.f && !p.nf && p.f[2] >= .06);
  /* oldest chapter first; per chapter the best photo of each shoot (picked ones first, then the most in the chapter colour), so no two frames look alike */
  ORDER.forEach(id => {
    const own = list.filter(p => p.chapter === id).sort((a, b) => (a.sel ? 0 : 1) - (b.sel ? 0 : 1) || (a.sel || 0) - (b.sel || 0) || (b.cm || 0) - (a.cm || 0) || b.f[2] - a.f[2]);
    const shoots = new Set(), pick = [];
    for (const p of own) { const k = (p.credit || "") + "|" + (p.date || ""); if (pick.length < PER && !shoots.has(k)) { shoots.add(k); pick.push(p); } }
    pick.sort((a, b) => ymd(a.date) < ymd(b.date) ? -1 : 1);
    pics.push(...pick);
  });
  /* every frame has to be loaded before it is shown: no empty squares with a date */
  const loaded = await Promise.all(pics.map(p => new Promise(ok => { const im = new Image(); im.alt = byId[p.chapter].label + " photo"; im.decoding = "async"; im.onload = () => ok(im); im.onerror = () => ok(null); im.src = big(p); })));
  pics = pics.filter((p, k) => loaded[k]); imgs = loaded.filter(Boolean);
  const st = $("stage"); imgs.forEach(im => st.append(im));
  $("t").max = Math.max(0, pics.length - 1);
  place(); show(0);
  addEventListener("resize", place);
});
/* face in the middle, same size every time, image always covers the square */
function place() {
  const F = $("stage").getBoundingClientRect().width;
  pics.forEach((p, k) => {
    const im = imgs[k], ar = (p.w || 600) / (p.h || 800);
    let h = .36 * F / p.f[2], w = h * ar;
    if (w < F) { w = F; h = w / ar; } if (h < F) { h = F; w = h * ar; }
    const left = Math.min(0, Math.max(F - w, F / 2 - p.f[0] * w)), top = Math.min(0, Math.max(F - h, F * .46 - p.f[1] * h));
    Object.assign(im.style, { width: w + "px", height: h + "px", left: left + "px", top: top + "px" });
  });
}
function show(k) {
  i = k; const p = pics[k]; if (!p) return;
  imgs.forEach((im, j) => im.classList.toggle("on", j === k));
  const c = byId[p.chapter]; paint(c);
  $("t").style.background = `linear-gradient(90deg, ${ORDER.filter(id => pics.some(q => q.chapter === id)).map(id => byId[id].bg).join(", ")})`;
  $("lab").textContent = c.label; $("when").textContent = p.date || "";
  $("t").value = k;
}
$("t").addEventListener("input", e => { stop(); show(+e.target.value); });
function stop() { clearInterval(timer); timer = null; $("play").textContent = "play"; }
$("play").onclick = () => {
  if (timer) return stop();
  if (i >= pics.length - 1) show(0);
  $("play").textContent = "pause";
  timer = setInterval(() => { if (i >= pics.length - 1) return stop(); show(i + 1); }, 900);
};
</script>
<script src="egg.js"></script>
</body>
