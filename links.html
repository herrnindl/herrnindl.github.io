:root { --bg: #FFF8BB; --fg: #1C1C14; --soft: rgba(28,28,20,.62); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {

main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
.brand { text-align: center; }
.mark { display: inline-block; font-family: "Bodoni Moda", "Didot", Georgia, serif; font-weight: 500; font-size: 56px; letter-spacing: .06em; line-height: 1; text-decoration: none; color: inherit; }
.name { font-size: 10px; letter-spacing: .5em; color: var(--soft); margin-top: 10px; text-align: center; }

ul { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 10px; }
a.btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-radius: 14px; text-decoration: none; background: var(--b); color: var(--t); font-weight: 800; font-size: 20px; letter-spacing: -.035em; transition: transform .15s ease; }
a.btn:active { transform: scale(.98); }
a.btn small { font-weight: 400; font-size: 12px; letter-spacing: .16em; opacity: .75; }
.sub { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.sub a { text-align: center; padding: 12px 6px; border: 1px solid rgba(28,28,20,.2); border-radius: 12px; text-decoration: none; color: inherit; font-weight: 500; font-size: 15px; letter-spacing: -.01em; }
footer { font-size: 11px; letter-spacing: .24em; color: var(--soft); text-align: center; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
