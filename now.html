  <div class="small">CHAPTER</div>

  <footer class="foot"></footer>
</div>
<script src="extra.js"></script>
<script>
/* ===== edit here ===== (empty "" = line is hidden) */
const NOW = {
  updated: "14.11.2026",
  onRepeat: "",        // e.g. "Coming Up Roses — Harry Styles"
  workingOn: "",       // e.g. "the website"
  reading: "",
};
/* chapters by date — the current one is picked automatically */
const RANGES = [["origin","2024-08-26"],["white","2025-03-03"],["baby-blue","2025-05-23"],["lavendel","2025-07-07"],["navy-blue","2025-10-21"],["grey","2026-01-01"],["vanilla","2026-04-01"],["vanilla-2","2026-06-23"],["ber","2026-09-01"],["ember","2026-11-01"],["red","2027-01-01"]];
const PLACE = { origin: "pinzgau.", white: "neukirchen.", "baby-blue": "fürstenfeld · graz.", lavendel: "italia.", "navy-blue": "dublin.", grey: "munich.", vanilla: "france.", "vanilla-2": "königsleiten · salzburg.", ember: "wildkogel." };
const EVENTS = [["website opens.", "2026-12-01"], ["red. begins.", "2027-01-01"], ["two years of MN.", "2027-01-01"]];
/* ===================== */
const today = new Date(); today.setHours(0, 0, 0, 0);
const d = s => new Date(s + "T00:00:00");
const cur = byId[[...RANGES].reverse().find(r => d(r[1]) <= today)[0]];
paint(cur);
$("chap").textContent = cur.label; $("line").textContent = cur.line;
$("upd").textContent = "updated " + NOW.updated + ".";
const rows = [];
if (PLACE[cur.id]) rows.push(["WHERE", PLACE[cur.id]]);
if (NOW.onRepeat) rows.push(["ON REPEAT", NOW.onRepeat]);
if (NOW.workingOn) rows.push(["WORKING ON", NOW.workingOn]);
if (NOW.reading) rows.push(["READING", NOW.reading]);
const next = EVENTS.filter(e => d(e[1]) > today);
if (next.length) {
  const days = Math.round((d(next[0][1]) - today) / 864e5);
  rows.push(["NEXT", next.filter(e => e[1] === next[0][1]).map(e => e[0]).join(" ") + " " + (days === 1 ? "tomorrow." : "in " + days + " days.")]);
}
rows.forEach(([k, v]) => { const li = el("li"); li.append(el("span", null, k), el("b", null, v)); $("list").append(li); });
</script>
