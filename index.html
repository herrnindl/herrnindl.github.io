<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MN. — Markus Nindl</title>
<meta name="description" content="MN. Photos of Markus Nindl, model from Pinzgau, sorted by colour chapter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  --bg: #0E0E0D; --surface: #191917; --line: #2B2A26;
  --fg: #FFF8BB; --muted: #A8A385; --ink: #F2F0E6; --chap: #FFF8BB;
  --display: "Syncopate", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

header { padding-block: 32px 20px; }
.mark { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 10vw, 84px); line-height: .9; color: var(--fg); }
.name { font-family: var(--display); font-size: 11px; letter-spacing: .55em; color: var(--muted); margin-top: 8px; white-space: nowrap; }

.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--surface); color: var(--fg); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c, transparent); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.dot.hollow { box-shadow: inset 0 0 0 1.5px var(--muted); }
.count { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.intro { display: grid; grid-template-columns: 6px 1fr; gap: 16px; padding-block: 28px 24px; }
.band { border-radius: 3px; background: var(--band, var(--chap)); }
.intro h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(24px, 5vw, 40px); color: var(--chap); line-height: 1.1; text-wrap: balance; }
.intro p { margin: 6px 0 0; color: var(--muted); }
.hex { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.wall { columns: 3 260px; column-gap: 12px; }
.tile { break-inside: avoid; margin: 0 0 12px; display: block; width: 100%; padding: 0; border: 0; background: var(--surface); border-radius: 4px; overflow: hidden; position: relative; }
.tile img { display: block; width: 100%; height: auto; transition: transform .4s ease; }
.tile:hover img { transform: scale(1.02); }
.tag { position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 6px; background: rgba(14,14,13,.72); font-size: 11px; padding: 3px 9px 3px 6px; border-radius: 999px; }
.tag .dot { width: 9px; height: 9px; }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 48px 20px; text-align: center; color: var(--muted); }

.lb { position: fixed; inset: 0; z-index: 20; background: rgba(8,8,7,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.lb img { max-height: calc(100% - 90px); object-fit: contain; border-radius: 4px; }
.lb .cap { text-align: center; }
.lb .cap b { display: block; color: var(--fg); font-weight: 500; }
.lb .cap small { color: var(--muted); }
.lb .cap a { color: var(--fg); text-decoration: none; border-bottom: 1px solid currentColor; }
.close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; width: 40px; height: 40px; font-size: 18px; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; width: 40px; height: 40px; }
.prev { left: 12px; } .next { right: 12px; }

footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; font-family: var(--mono); }
@media (prefers-reduced-motion: reduce) { .tile img { transition: none; } .tile:hover img { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">MN.</div>
    <div class="name">M A R K U S&nbsp;&nbsp;N I N D L</div>
  </header>

  <nav class="strip" aria-label="Chapters"><div class="chips" id="chips"></div></nav>

  <section class="intro">
    <div class="band"></div>
    <div>
      <h1 id="title">all chapters.</h1>
      <p id="line">Every photo, newest chapter first.</p>
      <div class="hex" id="hex"></div>
    </div>
  </section>

  <div class="wall" id="wall"></div>
  <div class="empty" id="empty" hidden>No photos in this chapter yet.</div>

  <footer><span>MN. — EST. 01.01.2025</span><span>Pinzgau, Austria</span></footer>
</div>

<div class="lb" id="lb" hidden>
  <button class="close" id="close" aria-label="Close">✕</button>
  <button class="nav prev" id="prev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <div class="cap"><b id="lbCap"></b><small id="lbSub"></small></div>
  <button class="nav next" id="next" aria-label="Next">›</button>
</div>

<script>
const CHAPTERS = [
  { id: "red", name: "red.", hex: "#B3202A", line: "coming 2027." },
  { id: "ember", name: "ember.", hex: "#E9A283", line: "the spark." },
  { id: "ber", name: "ber.", hex: "#B8C98B", line: "finding my color." },
  { id: "vanilla-2", name: "vanilla. II", hex: "#B8B05F", line: "trying it anyway, part two." },
  { id: "vanilla", name: "vanilla.", hex: "#FFF8BB", line: "trying it anyway." },
  { id: "grey", name: "grey.", hex: "#A9A9A9", line: "who am i?" },
  { id: "navy-blue", name: "navy blue.", hex: "#343A4E", line: "the end.", text: "#91A0C8" },
  { id: "lavendel", name: "lavendel.", hex: "#BAB6DE", line: "love." },
  { id: "baby-blue", name: "baby blue.", hex: "#91B2EB", line: "the beginning." },
  { id: "white", name: "white.", hex: "#FFFFFF", line: "the first pictures." },
  { id: "origin", name: "origin.", hex: null, line: "where it started." },
];
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const $ = id => document.getElementById(id);
let photos = [], filter = byId[location.hash.slice(1)] ? location.hash.slice(1) : "all", list = [], idx = -1;

function dot(c) {
  const d = document.createElement("span");
  d.className = "dot" + (c && c.hex ? "" : " hollow");
  if (c && c.hex) d.style.setProperty("--c", c.hex);
  return d;
}

function render() {
  const counts = {}; photos.forEach(p => counts[p.chapter] = (counts[p.chapter] || 0) + 1);
  const chips = $("chips"); chips.textContent = "";
  const make = (id, label, c, n) => {
    const b = document.createElement("button"); b.className = "chip";
    b.setAttribute("aria-pressed", String(filter === id));
    if (c) b.append(dot(c));
    const t = document.createElement("span"); t.textContent = label; b.append(t);
    if (n) { const k = document.createElement("span"); k.className = "count"; k.textContent = n; b.append(k); }
    b.onclick = () => { filter = id; history.replaceState(null, "", id === "all" ? location.pathname : "#" + id); render(); };
    chips.append(b);
  };
  make("all", "all", null, photos.length);
  CHAPTERS.forEach(c => make(c.id, c.name, c, counts[c.id]));

  const root = document.documentElement.style;
  if (filter === "all") {
    $("title").textContent = "all chapters."; $("line").textContent = "Every photo, newest chapter first."; $("hex").textContent = "";
    root.setProperty("--chap", "#FFF8BB"); root.removeProperty("--band");
  } else {
    const c = byId[filter];
    $("title").textContent = c.name; $("line").textContent = c.line; $("hex").textContent = c.hex || "";
    root.setProperty("--chap", c.text || c.hex || "#A8A385");
    root.setProperty("--band", c.hex || "#A8A385");
  }

  list = filter === "all" ? photos : photos.filter(p => p.chapter === filter);
  const wall = $("wall"); wall.textContent = "";
  $("empty").hidden = list.length > 0;
  list.forEach((p, i) => {
    const b = document.createElement("button"); b.className = "tile";
    const img = document.createElement("img"); img.src = p.src; img.loading = "lazy";
    img.alt = p.caption || (byId[p.chapter].name + " photo");
    b.append(img);
    if (filter === "all") {
      const t = document.createElement("span"); t.className = "tag"; t.append(dot(byId[p.chapter]));
      const s = document.createElement("span"); s.textContent = byId[p.chapter].name; t.append(s); b.append(t);
    }
    b.onclick = () => open(i);
    wall.append(b);
  });
}

function open(i) {
  idx = (i + list.length) % list.length; const p = list[idx];
  $("lbImg").src = p.src; $("lbImg").alt = p.caption || "";
  $("lbCap").textContent = p.caption || byId[p.chapter].name;
  const subEl = $("lbSub"); subEl.textContent = "";
  if (p.caption) subEl.append(byId[p.chapter].name);
  if (p.credit) {
    if (p.caption) subEl.append("  ·  ");
    subEl.append("photo: ");
    p.credit.split(/(@[A-Za-z0-9._]+)/).forEach(part => {
      if (/^@[A-Za-z0-9._]+$/.test(part)) {
        const a = document.createElement("a");
        a.href = "https://instagram.com/" + part.slice(1); a.target = "_blank"; a.rel = "noopener";
        a.textContent = part; subEl.append(a);
      } else if (part) subEl.append(part);
    });
  }
  $("prev").hidden = $("next").hidden = list.length < 2;
  $("lb").hidden = false;
}
const closeLb = () => { $("lb").hidden = true; };
$("close").onclick = closeLb;
$("prev").onclick = () => open(idx - 1);
$("next").onclick = () => open(idx + 1);
$("lb").onclick = e => { if (e.target === $("lb")) closeLb(); };
document.onkeydown = e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") open(idx - 1);
  if (e.key === "ArrowRight") open(idx + 1);
};

render();
fetch("photos.json", { cache: "no-cache" }).then(r => r.json()).then(d => { photos = d.filter(p => byId[p.chapter]); render(); }).catch(() => render());
</script>
</body>
</html>
